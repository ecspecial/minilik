server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    client_max_body_size 25m;

    # ^~ /api — все запросы, начинающиеся с /api (в т.ч. /api/auth/...), без случайного перехвата путей вроде /apix
    location ^~ /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Снимки сессий в JSON как /sessions/<uuid>/images/<n> — прокси на бэкенд /api/sessions/...
    # Иначе запрос попадает в SPA (try_files → index.html), а не в jpeg.
    location ~ ^/sessions/[0-9a-fA-F-]+/pipeline/[a-z0-9-]+$ {
        rewrite ^/sessions/(.*)$ /api/sessions/$1 break;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/sessions/[0-9a-fA-F-]+/images/[0-9]+$ {
        rewrite ^/sessions/(.*)$ /api/sessions/$1 break;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
