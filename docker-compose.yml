services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minilik-backend
    restart: unless-stopped
    # Корневой .env рядом с compose: все пары KEY= подставляются в контейнер.
    # Блок environment ниже перекрывает совпадающие ключи (и задаёт обязательные).
    env_file:
      - .env
    environment:
      PORT: "3000"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://mini-lik.ru,https://www.mini-lik.ru}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1.5}
      AUTH_LOGIN_USER_1: ${AUTH_LOGIN_USER_1:?set AUTH_LOGIN_USER_1 in .env}
      AUTH_LOGIN_PASS_1: ${AUTH_LOGIN_PASS_1:?set AUTH_LOGIN_PASS_1 in .env}
      AUTH_LOGIN_USER_2: ${AUTH_LOGIN_USER_2:?set AUTH_LOGIN_USER_2 in .env}
      AUTH_LOGIN_PASS_2: ${AUTH_LOGIN_PASS_2:?set AUTH_LOGIN_PASS_2 in .env}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_VERBOSE_AI: ${LOG_VERBOSE_AI:-}
    expose:
      - "3000"
    # Отладка на хосте: сравните с трафиком через 8080. curl 127.0.0.1:13000/api/...
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      # Хост ↔ контейнер: сессии JSON переживают пересоздание контейнера (права: uid 1001 = nestjs в образе).
      - /var/minilik/sessions:/var/minilik/sessions
    networks:
      - minilik

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minilik-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - minilik

networks:
  minilik:
    driver: bridge
